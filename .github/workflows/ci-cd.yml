name: CI/CD Pipeline

on:
    push:
        branches:
            - dev
    pull_request:
        branches:
            - dev

jobs:
    quality-check:
        name: Code Quality & Build
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: '22'
                  cache: 'npm'

            - name: Install dependencies
              run: npm ci

            - name: Check formatting
              run: npm run format:check
              # Fails if any files are not formatted correctly

            - name: Run linting
              run: npm run lint
              # Fails on ESLint errors (configure to allow warnings if needed)

            - name: Build project
              run: npm run build
              # Fails if build encounters any errors

    deploy-dev:
        name: Deploy to Dev Server
        needs: quality-check
        runs-on: ubuntu-latest

        # Only deploy on direct pushes to dev (not PRs) and if quality checks passed
        if: github.event_name == 'push' && github.ref == 'refs/heads/dev'

        steps:
            - name: Deploy to development server
              uses: appleboy/ssh-action@v1.0.3
              with:
                  host: ${{ secrets.DEV_SERVER_HOST }}
                  username: ${{ secrets.DEV_SERVER_USER }}
                  key: ${{ secrets.DEV_SERVER_SSH_KEY }}
                  port: ${{ secrets.DEV_SERVER_PORT || 22 }}
                  script: |
                      cd ~/dev.kirill.es
                      git pull origin dev
                      npm ci
                      npm run build
                      pm2 restart dev.kirill.es

            - name: Deployment notification
              if: success()
              run: echo "✅ Successfully deployed to dev server"

            - name: Deployment failed
              if: failure()
              run: |
                  echo "❌ Deployment failed - check logs"
                  exit 1
