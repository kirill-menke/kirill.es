no-neighbors: |
  Generate a new pixel-art landscape tile that matches the style of the provided reference tile.

  The new tile MUST:
  1. Contain the following content: ${prompt}
  2. Match the reference tile exactly in: pixel art style, color palette, perspective, lighting, and 16-bit RPG aesthetic
  3. Have the same dimensions as the reference tile
  4. Be designed so it could plausibly exist in the same game world as the reference tile

  CRITICAL:
    - Do NOT copy the reference tile's content — only use it as a style guide.
    - You are NOT allowed to have sky in the image

one-neighbor: |
  Extend the pixel-art landscape by inpainting ONLY the area marked with a GREEN BORDER containing WHITE inside. The existing artwork is on the ${direction} side.

  Requirements for the green-bordered white area:
  1. Content: ${prompt}
  2. Create a seamless, invisible transition at the edge where the green-bordered area meets the existing artwork on the ${direction}
  3. Continue any landscape elements (paths, water, terrain) that reach the edge of the green-bordered area naturally
  4. Match exactly: pixel art style, color palette, perspective, lighting, and 16-bit RPG aesthetic

  CRITICAL:
    - The GREEN BORDER with WHITE inside marks the ONLY region to be modified. All existing pixels outside this area must remain exactly as they are.
    - The result must look like one continuous image with no visible seam between the inpainted area and the existing content.
    - The color and style transition between the elements at the border and the existing content MUST be smooth, gradual and natural
    - Do NOT include the green border in your output — fill the entire marked area with generated content

two-neighbors: |
  Extend the pixel-art landscape by inpainting ONLY the area marked with a GREEN BORDER containing WHITE inside. Existing tiles are on the ${direction1} and ${direction2} sides.

  1. Content: ${prompt}
  2. Create seamless, invisible transitions at both the ${direction1} and ${direction2} edges where the green-bordered area meets existing artwork
  3. Continue any landscape elements (paths, water, terrain) that reach the green-bordered area's edges naturally
  4. Where elements from both neighbors meet within this area, merge them believably (e.g., two paths might converge, or terrain types should blend naturally)
  5. Match exactly: pixel art style, color palette, perspective, lighting, and 16-bit RPG aesthetic

  CRITICAL:
    - The GREEN BORDER with WHITE inside marks the ONLY region to be modified. All existing pixels outside this area must remain exactly as they are.
    - The result must look like one continuous image with no visible seam between the inpainted area and the existing content on ${direction1} and ${direction2}.
    - The color and style transition between the elements at the border and the existing content MUST be smooth, gradual and natural
    - Do NOT include the green border in your output — fill the entire marked area with generated content

three-neighbors: |
  Extend the pixel-art landscape by inpainting ONLY the area marked with a GREEN BORDER containing WHITE inside. Existing tiles are on the ${direction1}, ${direction2}, and ${direction3} sides.

  The content generated within the green-bordered area MUST:
  1. Content: ${prompt}
  2. Create seamless, invisible transitions at the ${direction1}, ${direction2}, and ${direction3} edges where the green-bordered area meets existing artwork
  3. Continue any landscape elements (paths, water, terrain) that reach the green-bordered area's boundaries naturally
  4. Reconcile elements coming from all three neighbors within this area — merge paths logically, blend terrain types smoothly, and resolve any conflicting elements in a natural way
  5. Match exactly: pixel art style, color palette, perspective, lighting, and 16-bit RPG aesthetic

  CRITICAL:
    - The GREEN BORDER with WHITE inside marks the ONLY region to be modified. All existing pixels outside this area must remain exactly as they are.
    - The result should look like one continuous image with no visible seams where the marked area connects to any neighbor.
    - Do NOT include the green border in your output — fill the entire marked area with generated content

four-neighbors: |
  Extend the pixel-art landscape by inpainting ONLY the area marked with a GREEN BORDER containing WHITE inside. This tile is surrounded by existing tiles on all four sides: top, bottom, left, and right.

  The content generated within the green-bordered area MUST:
  1. Content: ${prompt} (adapt as needed to fit the constraints from all four neighbors)
  2. Create seamless, invisible transitions on ALL four edges where the green-bordered area meets surrounding artwork
  3. Continue any landscape elements (paths, water, terrain) entering the green-bordered area from any edge and connect them logically within this region
  4. This is the most constrained case — prioritize seamlessness over the content prompt if they conflict. Elements from all four neighbors must connect believably within the marked area.
  5. Match exactly: pixel art style, color palette, perspective, lighting, and 16-bit RPG aesthetic

  CRITICAL:
    - The GREEN BORDER with WHITE inside marks the ONLY region to be modified. All existing pixels outside this area must remain exactly as they are.
    - The result must perfectly bridge all four surrounding tiles with no visible seams, with all new content contained entirely within the marked area.
    - Do NOT include the green border in your output — fill the entire marked area with generated content

transition-refinement: |
  Gradually blend the colors, terrain, and atmosphere from both panels sides
